<html lang="tr">
<head>

<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#9fd8ff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; user-select:none; -webkit-user-select:none; }
  canvas { display:block; }
  .panel { position:fixed; background:rgba(255,255,255,.9); color:#1d2a38; border-radius:14px; box-shadow:0 8px 24px #0002; }
  #mpStatus { position:fixed; top:12px; right:12px; z-index:8; padding:8px 12px; font-size:12px; pointer-events:none; }
  #mpStatus .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#f59e0b; margin-right:6px; }
  #mpStatus.online .dot { background:#22c55e; }
  #hud { top:12px; left:12px; padding:12px 14px; font-size:13px; line-height:1.6; min-width:230px; }
  #hud b { font-size:16px; }
  .bar { height:8px; background:#e2e8f0; border-radius:99px; overflow:hidden; margin:4px 0 8px; }
  .bar > div { height:100%; width:100%; background:linear-gradient(90deg,#34d399,#60a5fa); transition:width .2s; }
  #prompt { bottom:150px; left:50%; transform:translateX(-50%); padding:10px 16px; font-size:14px; display:none; white-space:nowrap; }
  #progress { top:50%; left:50%; transform:translate(-50%,-50%); padding:12px 16px; width:240px; text-align:center; display:none; font-size:14px; }
  #progress .bar > div { background:linear-gradient(90deg,#fbbf24,#f97316); transition:none; }
  #toast { top:14px; left:50%; transform:translate(-50%,-30px); padding:10px 16px; font-size:14px; opacity:0; transition:.25s; pointer-events:none; background:#1d2a38; color:#fff; max-width:92vw; text-align:center; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  #modal { position:fixed; inset:0; background:#0a13209c; display:flex; align-items:center; justify-content:center; padding:16px; z-index:20; }
  #modal.hidden, .hidden { display:none !important; }
  #modal .card { background:#fff; color:#1d2a38; border-radius:16px; width:min(480px,100%); max-height:86vh; overflow:auto; padding:18px; box-shadow:0 18px 50px #0006; }
  #modal h2 { margin:0 0 10px; font-size:19px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid #eef2f6; }
  .row small { display:block; color:#64748b; margin-top:3px; }
  .muted { color:#64748b; font-size:13px; line-height:1.5; }
  button { font:inherit; border:0; border-radius:10px; padding:9px 13px; background:#2563eb; color:#fff; font-weight:600; cursor:pointer; white-space:nowrap; }
  button:disabled { background:#cbd5e1; cursor:default; }
  button.ghost { background:#e2e8f0; color:#1d2a38; }
  #mClose { margin-top:12px; width:100%; background:#e2e8f0; color:#1d2a38; }
  /* Tanı satırı: sahnenin çizilip çizilmediğini gösterir */
  #dbg { top:auto; bottom:4px; left:50%; transform:translateX(-50%); padding:2px 8px; font-size:10px; color:#334155; background:#ffffffb3; border-radius:8px; z-index:4; white-space:nowrap; }
  /* Sanal joystick (sol alt) ve E düğmesi (sağ alt). Yatay/dikey fark etmez: yukarı itmek her zaman ileri. */
  #joy { position:fixed; left:calc(16px + env(safe-area-inset-left)); bottom:calc(16px + env(safe-area-inset-bottom)); width:150px; height:150px; border-radius:50%; background:#ffffff59; border:2px solid #ffffffaa; box-shadow:inset 0 0 14px #0001; touch-action:none; z-index:6; }
  #knob { position:absolute; left:50%; top:50%; width:64px; height:64px; margin:-32px 0 0 -32px; border-radius:50%; background:#ffffffe6; box-shadow:0 4px 12px #0003; pointer-events:none; }
  #touchE { position:fixed; right:calc(18px + env(safe-area-inset-right)); bottom:calc(22px + env(safe-area-inset-bottom)); width:82px; height:82px; border-radius:50%; border:0; background:#ffffffe0; color:#875477; font-size:26px; font-weight:800; box-shadow:0 6px 16px #0003; touch-action:none; z-index:6; padding:0; }
  #touchE:active { transform:scale(.96); }
  body { touch-action:none; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
  @media (pointer:coarse) { #prompt { font-size:13px; } }
  /* Telefon: HUD küçülür, joystick ve E düğmesi daha rahat yerleşir */
  @media (max-width:820px) {
    #hud { min-width:0; width:190px; padding:9px 11px; font-size:11px; line-height:1.5; }
    #hud b { font-size:14px; }
  }
  /* Yatay telefon (düşük yükseklik): HUD tek satıra yayılır, kontroller küçülür */
  @media (max-height:520px) {
    #hud { top:8px; left:8px; right:8px; width:auto; min-width:0; display:flex; flex-wrap:wrap; gap:2px 12px; align-items:center; padding:6px 10px; font-size:11px; }
    #hud > div { white-space:nowrap; }
    #hud .bar { width:70px; margin:0; }
    #hud > div:last-child { display:none; }
    #joy { width:120px; height:120px; bottom:calc(10px + env(safe-area-inset-bottom)); }
    #knob { width:52px; height:52px; margin:-26px 0 0 -26px; }
    #touchE { width:66px; height:66px; font-size:21px; bottom:calc(12px + env(safe-area-inset-bottom)); }
    #prompt { top:auto; bottom:calc(12px + env(safe-area-inset-bottom)); left:50%; }
  }
  @media (hover:hover) and (pointer:fine) { #joy, #touchE, #sprintBtn, #menuBtn { display:none; } }
  /* Sağ taraf: kamera sürükleme alanı (tüm ekran, düğmeler üstte) */
  #look { position:fixed; top:0; right:0; bottom:0; left:0; z-index:2; touch-action:none; }
  #sprintBtn, #menuBtn { position:fixed; touch-action:none; border:0; background:#ffffffd9; color:#1d2a38; box-shadow:0 4px 12px #0003; z-index:6; padding:0; }
  #sprintBtn { right:calc(26px + env(safe-area-inset-right)); bottom:calc(118px + env(safe-area-inset-bottom)); width:62px; height:62px; border-radius:50%; font-size:24px; }
  #menuBtn { right:calc(14px + env(safe-area-inset-right)); top:calc(10px + env(safe-area-inset-top)); width:42px; height:42px; border-radius:12px; font-size:20px; }
  /* Yükleme hatası: 3B kütüphane yüklenemezse bu ekran görünür */
  #loadErr { position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; text-align:center; padding:24px; background:#1d2a38e6; color:#fff; font-size:16px; line-height:1.6; }
  #loadErr.show { display:flex; }
  /* Dikey tutulursa oyunu durdurup "yan çevir" uyarısı göster (yalnızca dokunmatik cihazlarda) */
  #rotate { display:none; position:fixed; inset:0; z-index:50; background:#1d2a38; color:#fff; align-items:center; justify-content:center; text-align:center; font-size:18px; line-height:1.7; padding:24px; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display:flex; } }
</style>

<div id="mpStatus" class="panel"><span class="dot"></span><span id="mpText">Sunucuya bağlanıyor…</span></div>
<div id="hud" class="panel">
  <div><b id="hMoney">500 TL</b> <span id="hNet" style="color:#64748b;font-size:12px"></span></div>
  <div id="hDay"></div>

  <div class="bar"><div id="hEnergy"></div></div>
  <div id="hJob"></div>

</div>

<div id="prompt" class="panel"></div>

<div id="modal" class="hidden">
  <div class="card">
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
    <button id="mClose">Kapat</button>
  </div>
</div>

<script>
// Hata kutusu: yükleme veya çalışma sırasındaki hatayı ekranda gösterir
function gameError(msg) {
  const box = document.getElementById("loadErr");
  if (!box) return;
  box.querySelector(".err-msg").textContent = msg;
  box.classList.add("show");
}
window.addEventListener("error", ev => gameError("Hata: " + (ev.message || "bilinmeyen hata")));
window.addEventListener("unhandledrejection", ev => gameError("Hata: " + ((ev.reason && ev.reason.message) || ev.reason)));
setTimeout(() => { if (!window.__gameStarted) gameError("Oyun başlamadı. İnternet bağlantını kontrol et ve sayfayı yenile."); }, 8000);
</script>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

// ---------- Oyun ayarları ----------
const SAVE_KEY = "sehir-hayati-3d-v1";
const DAY_LENGTH = 60;        // gerçek saniye
const SHIFT_TIME = 8;         // bir vardiyanın süresi (sn)
const SHIFT_ENERGY = 25;
const REST_COST = 10;
const RENT = 60;              // kiralık evde günlük kira
const FOOD = 25;              // günlük yemek
const WIN_NET_WORTH = 50000;
const PLAYER_SPEED = 6;

const PROFESSIONS = {
  teacher:  { name: "Öğretmen", wage: 300, place: "school",     icon: "🏫", desc: "Okulda ders ver" },
  chef:     { name: "Aşçı",     wage: 400, place: "restaurant", icon: "🍳", desc: "Restoranda müşterilere yemek pişir" },
  engineer: { name: "Mühendis", wage: 700, place: "office",     icon: "🛠️", desc: "Ofiste projeleri yönet" },
  driver:   { name: "Taksici",  wage: 350, place: "taxi",       icon: "🚕", desc: "Taksi durağında yolcu taşı" }
};
const JOB_BY_PLACE = Object.fromEntries(Object.entries(PROFESSIONS).map(([k, p]) => [p.place, k]));

const HOUSES = [
  { name: "Apartman dairesi", price: 8000,  size: [9, 7, 8],   roof: 0x9a5a3a, color: 0xe8c39e },
  { name: "Villa",            price: 30000, size: [13, 9, 10], roof: 0x3b6e3b, color: 0xf4f1ea }
];
const CARS = [
  { name: "Sedan",      price: 6000,  speed: 1.3, maint: 12, color: 0x3a7bd5 },
  { name: "Spor araba", price: 20000, speed: 1.8, maint: 25, color: 0xe74c3c },
  { name: "Lüks SUV",   price: 45000, speed: 2.1, maint: 40, color: 0x222222 }
];

const PLACES = {
  school:     { x: -35, z: -20, w: 12, d: 9,  h: 7,  color: 0xf2c879, roof: 0xb0573a, label: "Okul" },
  restaurant: { x: 30,  z: -20, w: 11, d: 9,  h: 6,  color: 0xf7b59a, roof: 0x8b3a2b, label: "Restoran" },
  office:     { x: -35, z: 30,  w: 12, d: 10, h: 14, color: 0x9fb8c9, roof: 0x4a5a66, label: "Ofis" },
  taxi:       { x: 30,  z: 30,  w: 8,  d: 6,  h: 3,  color: 0xffd23f, roof: 0x333333, label: "Taksi durağı" },
  city:       { x: 0,   z: -62, w: 16, d: 12, h: 10, color: 0xdfe6ee, roof: 0x7a8699, label: "Belediye" },
  dealer:     { x: -62, z: -20, w: 12, d: 9,  h: 6,  color: 0xbfd7ea, roof: 0x2f5f8a, label: "Araba galerisi" },
  estate:     { x: 62,  z: -20, w: 12, d: 9,  h: 6,  color: 0xd9efc9, roof: 0x4f7f3a, label: "Emlak ofisi" }
};
const HOME = { x: -62, z: 40 };
const MAP_LIMIT = 95;

// ---------- Kayıt ----------
const defaultState = () => ({
  money: 500, day: 1, dayElapsed: 0, profession: null, shifts: 0,
  house: null, car: null, won: false, player: { x: 0, z: 20, h: 0 }
});
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) return { ...defaultState(), ...JSON.parse(raw) };
  } catch (e) { /* kayıt okunamazsa yeni oyun */ }
  return defaultState();
}
function save() {
  state.player = { x: player.position.x, z: player.position.z, h: heading };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) { /* gizli modda sessizce geç */ }
}
let state = load();
let energy = 100;

// ---------- Yardımcılar ----------
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("tr-TR");
const level = () => 1 + Math.floor(state.shifts / 10);
const wageOf = key => Math.round(PROFESSIONS[key].wage * (1 + 0.1 * (level() - 1)));
const netWorth = () => state.money
  + (state.house !== null ? HOUSES[state.house].price : 0)
  + (state.car !== null ? Math.round(CARS[state.car].price * 0.7) : 0);
const carSpeed = () => (state.car === null ? 1 : CARS[state.car].speed);
const rand = (a, b) => a + Math.random() * (b - a);

let toastTimer = null;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

// ---------- Üç boyutlu sahne ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
const isTouch = matchMedia("(pointer:coarse)").matches;
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa7d8f2);
scene.fog = new THREE.Fog(0xa7d8f2, 110, 280);

// Gerçekçi yansımalar ve ortam ışığı (PBR malzemeler bu sayede parlak ve doğal görünür)
const pmrem = new THREE.PMREMGenerator(renderer);
// Basit parlak bir ortam (harici örnek dosyaya gerek yok)
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0xdfeeff);
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.BackSide })));
try {
  scene.environment = pmrem.fromScene(envScene, 0.04).texture;
} catch (err) {
  console.warn("Ortam yansımaları kurulamadı:", err); // yansımalar olmasa da oyun çalışır
}

// Yordamsal dokular: resim dosyası gerektirmez
function canvasTexture(size, draw, repeatX = 1, repeatY = 1) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  draw(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
function speckle(ctx, size, base, spread, count) {
  for (let i = 0; i < count; i++) {
    const v = Math.round(base + (Math.random() - 0.5) * spread);
    ctx.fillStyle = `rgba(${v},${v},${v},0.35)`;
    ctx.fillRect(Math.random() * size, Math.random() * size, 2 + Math.random() * 3, 2 + Math.random() * 3);
  }
}
const grassTex = canvasTexture(256, (ctx, s) => {
  ctx.fillStyle = "#6fa34f"; ctx.fillRect(0, 0, s, s);
  speckle(ctx, s, 120, 90, 1400);
}, 40, 40);
const asphaltTex = canvasTexture(256, (ctx, s) => {
  ctx.fillStyle = "#3d4450"; ctx.fillRect(0, 0, s, s);
  speckle(ctx, s, 80, 60, 900);
  ctx.fillStyle = "#f4f1e8"; ctx.fillRect(s / 2 - 3, 0, 6, s * 0.6); // kesikli orta çizgi
}, 1, 22);
// Bina cephesi: pencere ızgarası (duvar rengi, malzemenin rengiyle çarpılır)
function facadeTexture(w, h) {
  const cols = Math.max(2, Math.round(w / 2.2)), rows = Math.max(2, Math.round(h / 3));
  return canvasTexture(256, (ctx, s) => {
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, s, s);
    const cw = s / cols, ch = s / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        ctx.fillStyle = Math.random() < 0.15 ? "#ffe9a8" : "#5d7a91"; // bazı pencereler yanık
        ctx.fillRect(c * cw + cw * 0.22, r * ch + ch * 0.25, cw * 0.56, ch * 0.5);
      }
    }
  }, 1, 1);
}

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);

scene.add(new THREE.HemisphereLight(0xdff1ff, 0x6b8a4a, 0.7));
const sun = new THREE.DirectionalLight(0xfff0d4, 2.2);
sun.position.set(40, 60, 20);
sun.castShadow = true;
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.03;
sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -100, right: 100, top: 100, bottom: -100 });
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(220, 220),
  new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Ana yol ve meydan
const plaza = new THREE.Mesh(new THREE.CylinderGeometry(12, 12, 0.05, 40), new THREE.MeshStandardMaterial({ color: 0x9aa3ad }));
plaza.position.y = 0.03;
scene.add(plaza);
const fountain = new THREE.Mesh(new THREE.CylinderGeometry(3, 3.4, 1.2, 24), new THREE.MeshStandardMaterial({ color: 0xbfe3ff }));
fountain.position.y = 0.6;
fountain.castShadow = true;
scene.add(fountain);
const road = new THREE.Mesh(new THREE.PlaneGeometry(10, 220), new THREE.MeshStandardMaterial({ map: asphaltTex, roughness: 0.85 }));
road.rotation.x = -Math.PI / 2; road.position.y = 0.02;
scene.add(road);

// ---------- Engeller ----------
const obstacles = [];
function addObstacle(x, z, w, d) {
  obstacles.push({ minX: x - w / 2 - 0.6, maxX: x + w / 2 + 0.6, minZ: z - d / 2 - 0.6, maxZ: z + d / 2 + 0.6 });
}
function makeBuilding(x, z, w, d, h, color, roofColor) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, map: facadeTexture(w, h), roughness: 0.75 }));
  body.position.y = h / 2;
  body.castShadow = body.receiveShadow = true;
  g.add(body);
  if (roofColor !== undefined) {
    const roof = new THREE.Mesh(new THREE.BoxGeometry(w + 0.6, 0.6, d + 0.6), new THREE.MeshStandardMaterial({ color: roofColor }));
    roof.position.y = h + 0.3;
    roof.castShadow = true;
    g.add(roof);
  }
  g.position.set(x, 0, z);
  scene.add(g);
  return g;
}

for (const p of Object.values(PLACES)) {
  makeBuilding(p.x, p.z, p.w, p.d, p.h, p.color, p.roof);
  addObstacle(p.x, p.z, p.w, p.d);
}

// Ağaçlar
for (let i = 0; i < 60; i++) {
  const x = rand(-88, 88), z = rand(-88, 88);
  if (Math.abs(x) < 16 && Math.abs(z) < 16) continue;
  if (isBlocked(x, z)) continue;
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2, 8), new THREE.MeshStandardMaterial({ color: 0x7a5230 }));
  trunk.position.y = 1; trunk.castShadow = true;
  const crown = new THREE.Mesh(new THREE.ConeGeometry(2.2, 4, 10), new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.27 + Math.random() * 0.06, 0.45, 0.3 + Math.random() * 0.08), roughness: 0.9 }));
  crown.position.y = 3.8; crown.castShadow = true;
  tree.add(trunk, crown);
  tree.position.set(x, 0, z);
  scene.add(tree);
  addObstacle(x, z, 1.2, 1.2);
}

function isBlocked(x, z) {
  return obstacles.some(o => x > o.minX && x < o.maxX && z > o.minZ && z < o.maxZ);
}
function pushOut(p) {
  for (const o of obstacles) {
    if (p.x > o.minX && p.x < o.maxX && p.z > o.minZ && p.z < o.maxZ) {
      const left = p.x - o.minX, right = o.maxX - p.x, top = p.z - o.minZ, bottom = o.maxZ - p.z;
      const m = Math.min(left, right, top, bottom);
      if (m === left) p.x = o.minX;
      else if (m === right) p.x = o.maxX;
      else if (m === top) p.z = o.minZ;
      else p.z = o.maxZ;
    }
  }

// Eklemli karakter: gövde, kafa, saç, bacak ve kollar ayrı parçalar. Yürürken kollar ve bacaklar sallanır.
function makeFigure(color) {
  const g = new THREE.Group();
  const cloth = new THREE.MeshStandardMaterial({ color, roughness: 0.8 });
  const skin = new THREE.MeshStandardMaterial({ color: 0xe8b894, roughness: 0.6 });
  const hair = new THREE.MeshStandardMaterial({ color: 0x2b2118, roughness: 0.9 });
  const pants = new THREE.MeshStandardMaterial({ color: 0x2e3a4d, roughness: 0.9 });
  const part = (geo, mat, x, y, z) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    m.castShadow = true;
    return m;
  };
  const torso = part(new THREE.CapsuleGeometry(0.34, 0.7, 4, 12), cloth, 0, 1.25, 0);
  const head = part(new THREE.SphereGeometry(0.27, 16, 12), skin, 0, 2.0, 0);
  const hairCap = part(new THREE.SphereGeometry(0.29, 16, 10, 0, Math.PI * 2, 0, Math.PI * 0.5), hair, 0, 2.05, 0);
  const legL = new THREE.Group(), legR = new THREE.Group();
  const armL = new THREE.Group(), armR = new THREE.Group();
  legL.position.set(-0.17, 0.85, 0); legR.position.set(0.17, 0.85, 0);
  armL.position.set(-0.45, 1.6, 0); armR.position.set(0.45, 1.6, 0);
  legL.add(part(new THREE.CapsuleGeometry(0.13, 0.55, 4, 8), pants, 0, -0.45, 0));
  legR.add(part(new THREE.CapsuleGeometry(0.13, 0.55, 4, 8), pants, 0, -0.45, 0));
  armL.add(part(new THREE.CapsuleGeometry(0.1, 0.5, 4, 8), cloth, 0, -0.4, 0));
  armR.add(part(new THREE.CapsuleGeometry(0.1, 0.5, 4, 8), cloth, 0, -0.4, 0));
  g.add(torso, head, hairCap, legL, legR, armL, armR);
  g.userData = { legL, legR, armL, armR, phase: 0 };
  return g;
}
// amount: 0 = dur, 1 = tam yürüyüş
function swing(g, dt, amount) {
  const u = g.userData;
  if (amount > 0) u.phase += dt * 8;
  const s = Math.sin(u.phase) * 0.7 * amount;
  u.legL.rotation.x = s;
  u.legR.rotation.x = -s;
  u.armL.rotation.x = -s * 0.8;
  u.armR.rotation.x = s * 0.8;
}

function addRemotePlayer(data) {
  if (!data || !data.id || data.id === socket?.id) return;
  let remote = remotePlayers.get(data.id);
  if (!remote) {
    const group = new THREE.Group();
    const figure = makeFigure(0xffb45c);
    group.add(figure, makeNameTag(data.name));
    scene.add(group);
    remote = { group, figure, targetX: 0, targetZ: 20, targetHeading: 0 };
    remotePlayers.set(data.id, remote);
  }
  remote.name = data.name || "Oyuncu";
  remote.targetX = Number.isFinite(data.x) ? data.x : 0;
  remote.targetZ = Number.isFinite(data.z) ? data.z : 20;
  remote.targetHeading = Number.isFinite(data.heading) ? data.heading : 0;
  if (data.x !== undefined && remote.group.position.length() === 0) {
    remote.group.position.set(remote.targetX, 0, remote.targetZ);

function removeRemotePlayer(id) {
  const remote = remotePlayers.get(id);
  if (!remote) return;
  scene.remove(remote.group);
  remote.group.traverse(obj => {
    if (obj.isSprite) { obj.material.map?.dispose(); obj.material.dispose(); }
  });
  remotePlayers.delete(id);
}
function updateRemotePlayers(dt) {
  for (const remote of remotePlayers.values()) {
    remote.group.position.x += (remote.targetX - remote.group.position.x) * Math.min(1, dt * 12);
    remote.group.position.z += (remote.targetZ - remote.group.position.z) * Math.min(1, dt * 12);
    let diff = remote.targetHeading - remote.group.rotation.y;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    remote.group.rotation.y += diff * Math.min(1, dt * 12);
    const moving = Math.hypot(remote.targetX - remote.group.position.x, remote.targetZ - remote.group.position.z) > 0.025;
    swing(remote.figure, dt, moving ? 1 : 0);
  }
}

function randomFreeSpot() {
  for (let i = 0; i < 20; i++) {
    const x = rand(-MAP_LIMIT, MAP_LIMIT), z = rand(-MAP_LIMIT, MAP_LIMIT);
    if (!isBlocked(x, z)) return { x, z };

function updateCitizens(dt) {
  for (const c of citizens) {
    const dx = c.target.x - c.g.position.x, dz = c.target.z - c.g.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 1) { c.target = randomFreeSpot(); continue; }
    const step = Math.min(dist, c.speed * dt);
    const nx = c.g.position.x + (dx / dist) * step, nz = c.g.position.z + (dz / dist) * step;
    if (!isBlocked(nx, nz)) { c.g.position.x = nx; c.g.position.z = nz; }
    else c.target = randomFreeSpot();
    c.g.rotation.y = Math.atan2(dx, dz);

// Joystick: yukarı = ileri, sağa/sola = dönüş. Ekran yönü değişse de eksenler ekrana göre sabit kalır,
// ve kamera oyuncunun arkasında olduğu için "ileri" her zaman karakterin baktığı yöndür.
const joy = { x: 0, y: 0, id: null };
const joyBase = $("joy"), knob = $("knob");
const JOY_R = 55;
function joyMove(e) {
  const r = joyBase.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2);
  let dy = e.clientY - (r.top + r.height / 2);
  const d = Math.hypot(dx, dy);
  if (d > JOY_R) { dx *= JOY_R / d; dy *= JOY_R / d; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  joy.x = dx / JOY_R;
  joy.y = dy / JOY_R;
}
function joyEnd() {
  joy.id = null; joy.x = 0; joy.y = 0;
  knob.style.transform = "translate(0px, 0px)";
}
joyBase.addEventListener("pointerdown", e => {
  joy.id = e.pointerId;
  joyBase.setPointerCapture(e.pointerId);
  joyMove(e);
  e.preventDefault();
});
joyBase.addEventListener("pointermove", e => { if (e.pointerId === joy.id) joyMove(e); });
for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) {
  joyBase.addEventListener(ev, e => { if (e.pointerId === joy.id) joyEnd(); });
}
$("touchE").addEventListener("pointerdown", e => { e.preventDefault(); useNearest(); });

// ---------- Güncelleme ----------
// ---------- Kamera ve hareket (PUBG Mobile tarzı) ----------
// Sol baş joystick: hareket. Sağ taraf sürükleme: kamera. Hareket, kameranın baktığı yöne göre yapılır
// ve karakter gittiği yöne döner. Yukarı = kameranın baktığı yön.
const camTarget = new THREE.Vector3();
let camYaw = heading;          // kameranın yönü (radyan)
let camPitch = 0.4;            // 0 = alçak kamera, 1 = yüksek kamera
let sprintHeld = false;        // ekrandaki koş düğmesi
const look = { id: null, x: 0, y: 0 };
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function turnTowards(a, b, maxStep) {
  let diff = b - a;
  while (diff > Math.PI) diff -= 2 * Math.PI;
  while (diff < -Math.PI) diff += 2 * Math.PI;
  return a + clamp(diff, -maxStep, maxStep);
}

function updatePlayer(dt) {
  if (keys.a) camYaw -= 2.2 * dt;
  if (keys.d) camYaw += 2.2 * dt;

  const fwd = clamp((keys.w ? 1 : 0) - (keys.s ? 0.6 : 0) + clamp(-joy.y, -0.6, 1), -0.6, 1);
  const side = clamp(joy.x, -1, 1);
  const len = Math.hypot(fwd, side);
  if (len <= 0.001) { swing(playerFigure, dt, 0); player.rotation.y = heading; return; }

  const sprinting = (keys.shift || sprintHeld) && energy > 5;
  const fx = Math.sin(camYaw), fz = Math.cos(camYaw);   // kameranın ileri yönü
  const rx = Math.cos(camYaw), rz = -Math.sin(camYaw);  // kameranın sağ yönü
  const dx = (fx * fwd + rx * side) / len;
  const dz = (fz * fwd + rz * side) / len;
  if (fwd >= 0) heading = turnTowards(heading, Math.atan2(dx, dz), 10 * dt);

  const speed = PLAYER_SPEED * carSpeed() * (sprinting ? 1.6 : 1) * Math.min(1, len);
  const p = player.position;
  p.x += dx * speed * dt;
  p.z += dz * speed * dt;
  if (sprinting) energy = Math.max(0, energy - 12 * dt);
  pushOut(p);
  p.x = clamp(p.x, -MAP_LIMIT, MAP_LIMIT);
  p.z = clamp(p.z, -MAP_LIMIT, MAP_LIMIT);
  swing(playerFigure, dt, 1);
  player.rotation.y = heading;
}

function updateCamera() {
  const p = player.position;
  const dist = 11, height = 3.5 + camPitch * 6;
  camTarget.set(p.x - Math.sin(camYaw) * dist, height, p.z - Math.cos(camYaw) * dist);
  camera.position.lerp(camTarget, 0.2);
  camera.lookAt(p.x, 1.5, p.z);
}

// Sağ taraf: sürükleyerek kamerayı döndür (yatay = yön, dikey = yükseklik)
const lookEl = $("look");
let lockTried = false;
function lockLandscape() {
  if (lockTried) return;
  lockTried = true;
  try { screen.orientation?.lock?.("landscape").catch(() => {}); } catch (e) { /* desteklenmiyorsa sorun değil */ }
}
lookEl.addEventListener("pointerdown", e => {
  if (look.id !== null) return;
  look.id = e.pointerId;
  look.x = e.clientX;
  look.y = e.clientY;
  lookEl.setPointerCapture(e.pointerId);
  lockLandscape();
});
lookEl.addEventListener("pointermove", e => {
  if (e.pointerId !== look.id) return;
  camYaw -= (e.clientX - look.x) * 0.006;
  camPitch = clamp(camPitch - (e.clientY - look.y) * 0.003, 0, 1);
  look.x = e.clientX;
  look.y = e.clientY;
});
for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) {
  lookEl.addEventListener(ev, e => { if (e.pointerId === look.id) look.id = null; });
}

const sprintEl = $("sprintBtn");
sprintEl.addEventListener("pointerdown", e => { e.preventDefault(); sprintHeld = true; });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) {
  sprintEl.addEventListener(ev, () => { sprintHeld = false; });
}
$("menuBtn").addEventListener("click", openStatus);

function openStatus() {
  const job = state.profession ? `${PROFESSIONS[state.profession].icon} ${PROFESSIONS[state.profession].name}` : "Yok";
  openModal("Durum", `
    <div class="row"><span>Nakit</span><b>${fmt(state.money)} TL</b></div>
    <div class="row"><span>Toplam varlık</span><b>${fmt(netWorth())} / ${fmt(WIN_NET_WORTH)} TL</b></div>
    <div class="row"><span>Meslek</span><b>${job}</b></div>
    <div class="row"><span>Seviye · vardiya</span><b>${level()} · ${state.shifts}</b></div>
    <div class="row"><span>Ev</span><b>${state.house === null ? "Kiralık" : HOUSES[state.house].name}</b></div>
    <div class="row"><span>Araba</span><b>${state.car === null ? "Yok" : CARS[state.car].name}</b></div>`);
}

let hudTimer = 0;
function updateHUD(dt) {
  hudTimer -= dt;
  if (hudTimer > 0) return;
  hudTimer = 0.2;
  $("hMoney").textContent = fmt(state.money) + " TL";
  $("hNet").textContent = "· Varlık: " + fmt(netWorth()) + " / " + fmt(WIN_NET_WORTH);
  $("hDay").textContent = `Gün ${state.day} · ${Math.max(0, Math.ceil(DAY_LENGTH - state.dayElapsed))} sn kaldı`;
  $("hEnergy").style.width = Math.round(energy) + "%";
  $("hJob").textContent = state.profession
    ? `${PROFESSIONS[state.profession].icon} ${PROFESSIONS[state.profession].name} · Seviye ${level()}`
    : "Meslek yok: Belediye'ye git";
  $("hHouse").textContent = "🏠 " + (state.house === null ? "Kiralık ev" : HOUSES[state.house].name);
  $("hCar").textContent = "🚗 " + (state.car === null ? "Araba yok" : CARS[state.car].name);
  $("dbg").textContent = `çizim:${renderer.info.render.calls} üçgen:${renderer.info.render.triangles} nesne:${scene.children.length} kamera:${camera.position.x.toFixed(0)},${camera.position.y.toFixed(0)},${camera.position.z.toFixed(0)} oyuncu:${player.position.x.toFixed(0)},${player.position.z.toFixed(0)}`;

  const near = nearestInteractable();
  const prompt = $("prompt");
  if (near && modal.classList.contains("hidden")) {
    prompt.style.display = "block";
    prompt.textContent = `E: ${near.label}`;
  } else prompt.style.display = "none";

  const pr = $("progress");
  pr.style.display = shift ? "block" : "none";
  if (shift) {
    $("pTitle").textContent = `${PROFESSIONS[shift.key].icon} ${PROFESSIONS[shift.key].name} vardiyası`;
    $("pBar").style.width = Math.min(100, Math.round(shift.progress * 100)) + "%";
  }
}

let saveTimer = 0;
let last = performance.now();
const isPortraitTouch = () => isTouch && matchMedia("(orientation: portrait)").matches;
// Her kare: hata olursa kutuda göster, döngü yine de devam eder
function frame(now) {
  try {
    frameStep(now);
  } catch (err) {
    console.error(err);
    window.gameError("Oyun hatası: " + (err && err.message ? err.message : err));
  }
  requestAnimationFrame(frame);
}
function frameStep(now) {
  window.__gameStarted = true;
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (isPortraitTouch()) {               // dikeyken oyun durur, "yan çevir" uyarısı görünür
    joy.x = 0; joy.y = 0;
    return;
  }

  updatePlayer(dt);
  updateCamera();
  updateRemotePlayers(dt);
  if (socket?.connected && now - lastNetworkSend > 80) {
    lastNetworkSend = now;
    socket.emit("player:update", { x: player.position.x, z: player.position.z, heading, name: playerName });
  }
  updateCitizens(dt);
  if (shift) updateShift(dt);

  energy = Math.min(100, energy + 2 * dt);
  state.dayElapsed += dt;
  if (state.dayElapsed >= DAY_LENGTH) nextDay();

  if (!state.won && netWorth() >= WIN_NET_WORTH) {
    state.won = true;
    save();
    openModal("🎉 Kazandın!", `<p class="muted">Varlığın ${fmt(netWorth())} TL'ye ulaştı. Oyun devam edebilir; istersen dükkanlara dönüp yeni hedefler belirle.</p>`);
  }

  saveTimer += dt;
  if (saveTimer > 5) { saveTimer = 0; save(); }

  updateHUD(dt);
  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener("beforeunload", save);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { /* çevrimdışı önbellek yoksa oyun yine çalışır */ });

updateCamera();
toast("Hoş geldin! Belediye'ye gidip bir meslek seç.");
requestAnimationFrame(frame);
</script>
</body>
</html>
